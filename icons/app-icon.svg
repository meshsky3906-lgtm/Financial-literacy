<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- U2便當盒風格 App 圖示:藍色滿版底 + 白色方塊(OS 會自行裁圓角,主體留在中央 80% 安全區內) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DA0FF"/>
      <stop offset="1" stop-color="#0066D6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 大方塊:上升折線 -->
  <rect x="112" y="120" width="288" height="160" rx="40" fill="#FFFFFF"/>
  <path d="M142 246 L192 214 L230 230 L288 176 L332 192 L370 150" fill="none" stroke="#0071E3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="370" cy="150" r="13" fill="#0071E3"/>
  <!-- 左下方塊:長條圖 -->
  <rect x="112" y="296" width="136" height="96" rx="32" fill="#D6F5DF"/>
  <rect x="140" y="346" width="20" height="24" rx="6" fill="#248A3D"/>
  <rect x="170" y="330" width="20" height="40" rx="6" fill="#248A3D"/>
  <rect x="200" y="314" width="20" height="56" rx="6" fill="#248A3D"/>
  <!-- 右下方塊:進度環 -->
  <rect x="264" y="296" width="136" height="96" rx="32" fill="#FFFFFF" fill-opacity="0.30"/>
  <circle cx="332" cy="344" r="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="10"/>
  <path d="M332 318 A26 26 0 0 1 358 344" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
</svg>
